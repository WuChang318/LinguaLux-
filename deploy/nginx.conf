# 宝塔 Nginx 站点配置示例
# 说明：宝塔面板"添加站点"会自动生成基础配置，你通常只需：
#   1) 把"运行目录"设为 /public
#   2) 在"伪静态"里粘贴下面 location / 的 try_files 规则（或直接选 ThinkPHP 规则）
# 以下为完整参考配置，sock 路径和域名按你的宝塔实际填写。

server {
    listen 80;
    server_name your-domain.com;                 # 改成你的域名或服务器 IP

    root /www/wwwroot/your-domain/backend/public; # 运行目录 = public
    index index.html index.php;

    # 静态资源优先，SPA 路由与 /api 全部回退到 index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 解析（交给 PHP-FPM；sock 路径以宝塔"PHP 项目"里显示的为准）
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/tmp/php-cgi-74.sock;   # 按宝塔实际的 PHP 版本 sock 修改
    }

    # 禁止访问隐藏文件（.env 等）
    location ~ /\. {
        deny all;
    }
}
